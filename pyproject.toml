[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plex2letterboxd"
version = "1.4"
description = "Export watched Plex movies to the Letterboxd import format."
authors = [
  {name = "Max Timkovich", email = "max@timkovi.ch"}
]
readme = "README.md"
license = {file = "LICENSE"}

dependencies = [
  "plexapi>=4.15.7",
  "requests>=2.28"
]
requires-python = ">=3"

[project.optional-dependencies]
# `pip install plex2letterboxd[upload]` enables --upload by adding curl_cffi,
# which impersonates a real Chrome TLS fingerprint to get past Cloudflare's
# bot challenge on letterboxd.com.
upload = [
  "curl_cffi>=0.7"
]

[project.scripts]
plex2letterboxd = "plex2letterboxd.plex2letterboxd:main"
